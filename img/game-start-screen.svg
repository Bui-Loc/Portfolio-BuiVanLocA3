<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">SKY &amp; RHYTHM: BOSS RUSH — màn hình bắt đầu</title>
  <desc id="description">Giao diện pixel với hai lựa chọn Flappy Boss và Dash Boss.</desc>
  <defs>
