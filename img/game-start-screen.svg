    </pattern>
    <pattern id="tiles" width="48" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 0h32v4H0zM16 16h32v4H16z" fill="#74406f" opacity=".8"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
